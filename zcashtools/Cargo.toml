[workspace]
resolver = "2"

members = ["neon/native"]

[profile.release]
opt-level = "s"
overflow-checks = true

[patch.crates-io]
ledger-zcash-builder = { git = "https://github.com/Zondax/ledger-zcash-rs", rev = "3bad2fa4a7870270627edc25ebdb5b4818fd1855" }
ledger-zcash = { git = "https://github.com/Zondax/ledger-zcash-rs", rev = "3bad2fa4a7870270627edc25ebdb5b4818fd1855" }

# Redirect the Zondax librustzcash git crates to the local fork (adds Nu6_1/Nu6_2/Nu6_3 branch IDs).
# This ensures zcashtool and ledger-zcash(-builder) share a single zcash_primitives, so BranchId types unify.
[patch."https://github.com/Zondax/librustzcash"]
zcash_primitives = { path = "neon/native/librustzcash/zcash_primitives" }
zcash_proofs = { path = "neon/native/librustzcash/zcash_proofs" }
equihash = { path = "neon/native/librustzcash/components/equihash" }
zcash_encoding = { path = "neon/native/librustzcash/components/zcash_encoding" }
zcash_note_encryption = { path = "neon/native/librustzcash/components/zcash_note_encryption" }

# ledger-zcash-builder = { path = "../../ledger-zcash-rs/ledger-zcash-builder" }
# ledger-zcash = { path = "../../ledger-zcash-rs/ledger-zcash" }
